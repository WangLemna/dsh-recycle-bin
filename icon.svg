<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Session recycle bin">
  <defs>
    <linearGradient id="bin-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8ae0"/>
      <stop offset="1" stop-color="#1f5fa8"/>
    </linearGradient>
  </defs>
  <!-- bin body: a tapered container with rounded bottom -->
  <path d="M16 20h32l-3.2 32.2a6 6 0 0 1-6 5.4H25.2a6 6 0 0 1-6-5.4z" fill="url(#bin-body)"/>
  <!-- lid -->
  <rect x="12" y="13" width="40" height="6" rx="3" fill="#5aa4ef"/>
  <!-- handle -->
  <path d="M27 9h10a3 3 0 0 1 3 3v1H24v-1a3 3 0 0 1 3-3z" fill="#8ec4f8"/>
  <!-- a chat bubble disappearing into the bin: the deleted session -->
  <path d="M28 27h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-4l-4 3v-3h0a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3z" fill="#ffffff" opacity="0.92"/>
  <!-- recycle arrow: restore path, not a plain trash can -->
  <path d="M23.4 46.5a9 9 0 0 0 17.2 0" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.75"/>
  <path d="M40.9 43.2l1.6 4.2-4.4.5z" fill="#ffffff" opacity="0.75"/>
</svg>
